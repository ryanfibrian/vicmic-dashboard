<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vicmic Kurir</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="view-login" class="view">
    <div class="login-card">
      <h1>🚚 Vicmic Kurir</h1>
      <p class="muted small">Login dengan akun Google yang sudah terdaftar sebagai kurir di Vicmic Dashboard.</p>
      <button id="btn-google-login" class="btn btn-primary btn-block">Masuk dengan Google</button>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <div id="view-trip" class="view" hidden>
    <header class="topbar">
      <div>
        <strong id="user-name">–</strong>
        <div class="muted small" id="user-email">–</div>
      </div>
      <button id="btn-logout" class="btn btn-ghost btn-sm">Keluar</button>
    </header>

    <main class="content">
      <div id="status-banner" class="status-banner" hidden></div>

      <div id="card-start" class="card" hidden>
        <h2>📝 Mulai Perjalanan</h2>
        <div class="field">
          <label for="f-from">Lokasi Asal</label>
          <div class="loc-row">
            <input type="text" id="f-from" placeholder="Ketik lokasi asal…" autocomplete="off">
            <button type="button" class="btn-icon-sm" data-pick="from" title="Pilih di peta">🗺️</button>
            <button type="button" class="btn-icon-sm" data-fav="from" title="Alamat favorit">⭐</button>
          </div>
        </div>
        <div class="field">
          <label for="f-to">Lokasi Tujuan</label>
          <div class="loc-row">
            <input type="text" id="f-to" placeholder="Ketik lokasi tujuan…" autocomplete="off">
            <button type="button" class="btn-icon-sm" data-pick="to" title="Pilih di peta">🗺️</button>
            <button type="button" class="btn-icon-sm" data-fav="to" title="Alamat favorit">⭐</button>
          </div>
        </div>
        <div class="field">
          <label for="f-distance">Jarak (KM)</label>
          <input type="text" inputmode="decimal" id="f-distance" placeholder="Contoh: 5.5 atau 5,5" autocomplete="off">
          <p class="route-hint" id="distance-hint"></p>
        </div>
        <button id="btn-start" class="btn btn-primary btn-block">🚀 Mulai Jalan</button>
      </div>

      <div id="card-active" class="card" hidden>
        <h2>🛵 Sedang Jalan</h2>
        <p><span class="muted">Dari</span> — <strong id="active-from"></strong></p>
        <p><span class="muted">Ke</span> — <strong id="active-to"></strong></p>
        <p><span class="muted">Jarak</span> — <strong id="active-km"></strong> KM</p>
        <div class="mono" id="active-timer">00:00:00</div>
        <p class="gps-indicator" id="gps-indicator">📍 GPS aktif — posisi terkirim ke admin tiap ±15 detik</p>
        <button id="btn-finish" class="btn btn-danger btn-block">✅ Selesai</button>
      </div>
    </main>
  </div>

  <!-- Full-screen map picker: tap a "🗺️" button on Lokasi Asal/Tujuan to open. -->
  <div id="view-mappicker" class="view" hidden>
    <header class="topbar">
      <button type="button" id="btn-mappicker-cancel" class="btn btn-ghost btn-sm">✕ Batal</button>
      <strong id="mappicker-title">Pilih Lokasi</strong>
      <span style="width:52px"></span>
    </header>
    <div class="mp-search-wrap">
      <input type="text" id="mp-search" class="mp-search-input" placeholder="Cari nama tempat / alamat…" autocomplete="off">
      <div id="mp-search-results" class="mp-search-results" hidden></div>
    </div>
    <div class="mp-map-wrap">
      <div id="mappicker-map" class="mp-map"></div>
      <div class="mp-center-pin" aria-hidden="true">📍</div>
    </div>
    <div class="mp-bottom">
      <p class="mp-address" id="mp-address">Geser peta untuk pilih titik…</p>
      <button type="button" id="btn-mappicker-confirm" class="btn btn-primary btn-block">Gunakan Lokasi Ini</button>
    </div>
  </div>

  <!-- Favorites bottom sheet: tap a "⭐" button to open. -->
  <div id="fav-modal" class="modal-overlay" hidden>
    <div class="modal-sheet">
      <div class="modal-sheet-header">
        <strong>⭐ Alamat Favorit</strong>
        <button type="button" id="btn-fav-close" class="btn-icon-sm">✕</button>
      </div>
      <div id="fav-list" class="fav-list"></div>
      <button type="button" id="btn-fav-save-current" class="btn btn-secondary btn-block" hidden>💾 Simpan lokasi field ini sebagai favorit</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
