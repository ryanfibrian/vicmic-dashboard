<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vicmic Kurir</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="view-login" class="view">
    <div class="login-card">
      <div class="login-logo">🚚</div>
      <h1>Vicmic Kurir</h1>
      <p class="muted small">Masuk dengan akun Google yang terdaftar sebagai kurir.</p>
      <button id="btn-google-login" class="btn btn-primary btn-block">Masuk dengan Google</button>
      <p id="login-error" class="error-text"></p>
    </div>
  </div>

  <div id="view-trip" class="view" hidden>
    <header class="topbar">
      <div class="topbar-user">
        <strong id="user-name">–</strong>
        <span class="muted small" id="user-email">–</span>
      </div>
      <button id="btn-logout" class="btn btn-ghost btn-sm">Keluar</button>
    </header>

    <main class="content">
      <div id="status-banner" class="status-banner" hidden></div>

      <section id="card-start" class="card" hidden>
        <h2 class="card-title">Mulai Perjalanan</h2>

        <div class="journey">
          <button type="button" class="journey-row" data-pick="from">
            <span class="journey-mark"><span class="mark-dot"></span></span>
            <span class="journey-text">
              <span class="journey-label">Lokasi Asal</span>
              <span class="journey-value is-empty" id="v-from">Pilih lokasi asal</span>
            </span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>

          <span class="journey-line" aria-hidden="true"></span>

          <button type="button" class="journey-row" data-pick="to">
            <span class="journey-mark"><span class="mark-sq"></span></span>
            <span class="journey-text">
              <span class="journey-label">Lokasi Tujuan</span>
              <span class="journey-value is-empty" id="v-to">Pilih lokasi tujuan</span>
            </span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>

        <div id="route-preview" class="route-preview" hidden>
          <div id="route-map" class="route-map"></div>
          <div class="route-stats">
            <span class="route-km" id="route-km">–</span>
            <span class="route-sep">·</span>
            <span class="route-eta" id="route-eta">–</span>
          </div>
        </div>

        <div class="distance-row">
          <span class="distance-label">Jarak dipakai</span>
          <span class="distance-value" id="distance-value">–</span>
          <button type="button" id="btn-manual-km" class="link-btn">ubah manual</button>
        </div>
        <div id="manual-km-wrap" class="manual-km" hidden>
          <input type="text" inputmode="decimal" id="f-distance" placeholder="Contoh: 5,5" autocomplete="off">
        </div>
        <p class="route-hint" id="distance-hint"></p>

        <button id="btn-start" class="btn btn-primary btn-block btn-lg">Mulai Jalan</button>
      </section>

      <section id="card-active" class="card" hidden>
        <h2 class="card-title">Sedang Jalan</h2>
        <div class="active-route">
          <div class="active-leg"><span class="mark-dot"></span><span id="active-from"></span></div>
          <span class="journey-line short" aria-hidden="true"></span>
          <div class="active-leg"><span class="mark-sq"></span><span id="active-to"></span></div>
        </div>
        <div class="timer" id="active-timer">00:00:00</div>
        <div class="active-meta"><span id="active-km"></span> KM</div>
        <p class="gps-indicator" id="gps-indicator">GPS aktif — posisi terkirim ke admin tiap ±15 detik</p>
        <button id="btn-finish" class="btn btn-danger btn-block btn-lg">Selesai</button>
      </section>
    </main>
  </div>

  <!-- Full-screen location picker: search, saved places, and a map. -->
  <div id="view-mappicker" class="view" hidden>
    <header class="mp-top">
      <button type="button" id="btn-mappicker-cancel" class="icon-btn" aria-label="Kembali">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="mp-search-wrap">
        <svg class="mp-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="mp-search" class="mp-search-input" placeholder="Cari alamat atau tempat…" autocomplete="off">
        <div id="mp-search-results" class="mp-search-results" hidden></div>
      </div>
    </header>

    <div id="mp-chips" class="mp-chips"></div>

    <div class="mp-map-wrap">
      <div id="mappicker-map" class="mp-map"></div>
      <div class="mp-center-pin" aria-hidden="true">
        <span class="pin-head"></span>
        <span class="pin-stick"></span>
        <span class="pin-shadow"></span>
      </div>
      <button type="button" id="btn-mp-locate" class="mp-fab" aria-label="Ke lokasi saya">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>

    <div class="mp-sheet">
      <span class="mp-sheet-label" id="mp-sheet-label">Lokasi Asal</span>
      <p class="mp-address" id="mp-address">Geser peta untuk memilih titik…</p>
      <div class="mp-sheet-actions">
        <button type="button" id="btn-fav-save" class="btn btn-secondary">Simpan</button>
        <button type="button" id="btn-mappicker-confirm" class="btn btn-primary">Gunakan Lokasi Ini</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
